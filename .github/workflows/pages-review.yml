name: Scientific review preview (manual approval required)
on:
  workflow_dispatch:
    inputs:
      public_visibility_approved:
        description: Owner has cleared this exact preview for public visibility
        type: boolean
        required: true
        default: false
      approved_commit_sha:
        description: Exact audited commit cleared by the owner
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: pages-review
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.public_visibility_approved == true && vars.PUBLIC_VISIBILITY_APPROVED == 'true' && github.sha == inputs.approved_commit_sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out approved static source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify existing static assets (no scientific processing)
        run: python3 tools/verify_site.py
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload prerendered site only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - name: Deploy approved preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
